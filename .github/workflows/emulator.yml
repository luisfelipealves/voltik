name: Playback on Android emulator
on:
  push:
    branches: ["agent/projectm-experimental"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download and verify projectM
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 -o app/libs/projectM-TV-core-2.3.57.aar https://github.com/johnneerdael/ProjectM-Android/releases/download/v2.3.57/projectM-TV-core-2.3.57.aar
          echo "b18f9d0bc4b108d424d05cb8d7923c3ca4134faad86faf64da5d5ed95ed4c337  app/libs/projectM-TV-core-2.3.57.aar" | sha256sum -c -
      - name: Prepare disposable test signing
        run: |
          mkdir -p .debug-signing
          keytool -genkeypair -keystore .debug-signing/debug.keystore -storetype JKS -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real SAF playback test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            base64 --decode .github/testdata/voltik-saf.mp3.b64 > /tmp/voltik-fixture.mp3
            adb shell mkdir -p /sdcard/Music/VoltikSafFixture
            adb push /tmp/voltik-fixture.mp3 /sdcard/Music/VoltikSafFixture/fixture.mp3
            gradle --no-daemon -Pvoltik.ci.x86PlaybackOnly=true :app:assembleDebug :app:assembleDebugAndroidTest
            # This APK is only for x86 playback tests; never upload it for distribution.
            ! unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Eq '^lib/(arm64-v8a|armeabi-v7a)/'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            gradle --no-daemon -Pvoltik.ci.x86PlaybackOnly=true :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.voltik.player.SafPlaybackInstrumentedTest,com.voltik.player.LevelAudioProcessorTest,com.voltik.player.LevelAudioPcmInstrumentedTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.voltik.player
            gradle --no-daemon -Pvoltik.ci.x86PlaybackOnly=true :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.voltik.player.SafPlaybackFocusInstrumentedTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-results
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

