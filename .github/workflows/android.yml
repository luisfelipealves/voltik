name: Android CI
on:
  push:
    branches: ["agent/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voltik-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preserve debug signing key for updates
        uses: actions/cache@v4
        with:
          path: .debug-signing/debug.keystore
          key: voltik-debug-key-v2
      - name: Create debug key if no cached key exists
        run: |
          mkdir -p .debug-signing
          if [ ! -f .debug-signing/debug.keystore ]; then
            keytool -genkeypair -keystore .debug-signing/debug.keystore -storetype JKS -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: voltik-debug
          path: app/build/outputs/apk/debug/app-debug.apk
