name: Android CI
on:
  push:
    branches: ["agent/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voltik-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download and verify projectM
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 -o app/libs/projectM-TV-core-2.3.57.aar https://github.com/johnneerdael/ProjectM-Android/releases/download/v2.3.57/projectM-TV-core-2.3.57.aar
          echo "b18f9d0bc4b108d424d05cb8d7923c3ca4134faad86faf64da5d5ed95ed4c337  app/libs/projectM-TV-core-2.3.57.aar" | sha256sum -c -
      - name: Prepare disposable testing key
        run: |
          mkdir -p .debug-signing
          keytool -genkeypair -keystore .debug-signing/debug.keystore -storetype JKS -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: experimental-do-not-install
          path: app/build/outputs/apk/debug/app-debug.apk
