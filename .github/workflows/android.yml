name: Android CI
on:
  push:
    branches: ["agent/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voltik-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download and prepare projectM
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 -o app/libs/projectM-TV-core-2.3.57.aar https://github.com/johnneerdael/ProjectM-Android/releases/download/v2.3.57/projectM-TV-core-2.3.57.aar
          echo "b18f9d0bc4b108d424d05cb8d7923c3ca4134faad86faf64da5d5ed95ed4c337  app/libs/projectM-TV-core-2.3.57.aar" | sha256sum -c -
          python3 scripts/prepare_projectm.py app/libs/projectM-TV-core-2.3.57.aar
      - name: Preserve debug signing key for updates
        uses: actions/cache@v4
        with:
          path: .debug-signing/debug.keystore
          key: voltik-debug-key-v2
      - name: Verify existing debug signing identity
        shell: bash
        run: |
          test -s .debug-signing/debug.keystore || { echo "::error::A chave de teste não está disponível; não gerar uma nova automaticamente."; exit 1; }
          actual=$(keytool -exportcert -keystore .debug-signing/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          test "$actual" = "b4a28aa309faf6fa2a3a96d3d038961b3688fdcbc37c2f43df28a400f226de30" || { echo "::error::Assinatura diferente da versão 0.1.2."; exit 1; }
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: voltik-debug
          path: app/build/outputs/apk/debug/app-debug.apk
